<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe6">
<title>Тренировки</title>
<style>
:root{--bg:#f6efe6;--card:#fffaf3;--ink:#3b2f2a;--mute:#8a7a6d;--line:#e8dccd;--acc:#b85c3c;--soft:#f3e3d6;--ok:#6b8f6e;--on:#fff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#231d19;--card:#2e2621;--ink:#f2e8dc;--mute:#a8998b;--line:#463a32;--acc:#e08a68;--soft:#40302a;--ok:#8fb391;--on:#231d19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,system-ui,-apple-system,Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:560px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:28px;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
#nav button.on{color:var(--acc);font-weight:600}
.th{display:flex;align-items:center;gap:10px;padding:18px 0 10px}
.th>div{flex:1}
.sub{color:var(--mute);font-size:14px}
.nv{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;padding:0}
.pb{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.pb i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
.ex{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gc,var(--line));border-radius:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(80,50,30,.06)}
.ex.dragging{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 10px 28px rgba(0,0,0,.3);margin:0}
.hdr{display:flex;align-items:center;gap:6px;padding:12px 12px 12px 10px}
.hd{flex:1;min-width:0}
.hd b{display:block;font-size:17px}
.hd small{color:var(--mute);font-size:13px}
.ex.done .hd b{color:var(--mute);text-decoration:line-through}
.cnt{font-size:13px;color:var(--mute);background:var(--bg);border-radius:12px;padding:2px 10px;flex:none}
.ex.done .cnt{background:var(--ok);color:var(--on)}
.grip{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:0;background:none;color:var(--mute);font-size:24px;line-height:1;padding:6px 4px;cursor:grab}
.body{padding:0 12px 12px}
.nm,.grp{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px;margin-bottom:8px}
.nm{font-weight:600}
.grp{color:var(--acc)}
.set{display:grid;grid-template-columns:18px 40px 1fr 1.7fr;gap:8px;align-items:center;margin-top:8px}
.set.sh{font-size:12px;color:var(--mute);margin-top:4px}
.sn{color:var(--mute);font-size:14px}
.sc{width:38px;height:38px;border-radius:50%;border:2px solid var(--mute);background:none;color:transparent;font-size:18px;line-height:1;padding:0}
.sc.on{background:var(--ok);border-color:var(--ok);color:var(--on)}
.set input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:18px;text-align:center;padding:0 4px;min-width:0}
.wt{display:flex;gap:4px;align-items:center}
.wt button{flex:none;width:36px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--acc);font-size:20px;padding:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:7px 14px;font-size:14px}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.pill.acc{color:var(--acc);border-color:var(--acc)}
.pill.del{margin-left:auto;color:var(--mute)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:14px 0 8px}
#tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0 6px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab small{font-size:11px;font-weight:400;color:var(--mute)}
.tab.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
#sub{display:flex;gap:6px;margin-top:8px}
.dragmode .tab,.dragmode .pill[data-drop]{border:2px dashed var(--acc)}
.over{background:var(--acc)!important;color:var(--on)!important}
.over small{color:var(--on)!important}
.gh{font-size:17px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.gh small{color:var(--mute);font-weight:400;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:28px 0}
.add{width:100%;margin-top:6px;padding:14px;border:2px dashed var(--line);border-radius:18px;background:none;color:var(--acc);font-weight:600}
.link{display:block;margin:26px auto 0;border:0;background:none;color:var(--mute);text-decoration:underline}
.card2{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.mrow{display:grid;grid-template-columns:1.2fr 1.2fr 34px 34px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow.h{color:var(--mute);font-size:12px;padding:8px 0}
.mrow.t{font-weight:600}
.mrow .v{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.mbar{position:relative;height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.mbar .pl{opacity:.35}
dialog{width:min(92vw,480px);border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 6px;font-size:20px}
dialog p{margin:0 0 10px;color:var(--mute);font-size:14px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:8px;font:13px monospace}
dialog button{margin:8px 8px 0 0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
dialog button.main{background:var(--acc);border-color:var(--acc);color:var(--on)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.rc b{display:block}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rrow>div{min-width:0}
.rc .pb{margin:8px 0 0}
.btn{border:0;border-radius:16px;background:var(--acc);color:var(--on);font-weight:600;padding:12px 18px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.out{background:none;border:1px solid var(--acc);color:var(--acc)}
.btn.wide{display:block;width:100%;padding:16px;font-size:18px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.bigt{font-size:52px;font-weight:700;text-align:center;line-height:1.1;margin:6px 0;font-variant-numeric:tabular-nums}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.mt small{display:block;color:var(--mute);font-size:12px}
.mt b{font-size:22px;font-variant-numeric:tabular-nums}
.rmap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;margin:8px 0}
svg.rm{width:100%;height:auto;display:block}
.gps{display:inline-block;font-size:12px;padding:3px 10px;border-radius:12px;background:var(--soft);color:var(--mute)}
.gps.ok{background:var(--ok);color:var(--on)}
.rli{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.rli:last-child{border-bottom:0}
.rli small{color:var(--mute);display:block;font-size:13px}
.sbar{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.sbar>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;font-size:11px;color:var(--mute)}
.sbar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--soft);min-height:2px}
.sbar i.g{background:var(--ok)}
.sbar i.t{background:var(--acc)}
.ringw{text-align:center;margin:6px 0}
svg.ring{width:180px;height:180px}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.cfg input,.rp input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;text-align:center;padding:0 4px;min-width:0}
.rp{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 0}
.rp label{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute);gap:4px}
.warn{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.spl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.spl:last-child{border-bottom:0}
</style>
</head>
<body>
<main><div id="view"></div></main>
<nav id="nav">
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Сегодня</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>План</button>
  <button data-tab="run"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>Бег</button>
  <button data-tab="steps"><svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="1"/><path d="M7 21l3-4M16 21l-2-4-3-3 1-6M6 12l2-3 4-1 3 3 3 1"/></svg>Шаги</button>
  <button data-tab="muscles"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Мышцы</button>
</nav>
<datalist id="groups"></datalist>
<div id="toast"></div>

<dialog id="dlg">
  <h2>Данные</h2>
  <p>Сохрани копию в файл или скопируй текст в заметки. Планы, тренировки, пробежки и шаги можно вернуть обратно, например на новом телефоне.</p>
  <textarea id="bk" rows="6"></textarea>
  <div>
    <button class="main" id="sv">Сохранить в файл</button>
    <button id="ld">Загрузить из файла</button>
    <input type="file" id="bf" accept=".json,application/json,text/plain" hidden>
    <button id="cp">Скопировать</button>
    <button id="rs">Восстановить из текста</button>
    <button id="rst">Начать новую неделю</button>
    <button id="cl">Закрыть</button>
  </div>
</dialog>

<script>
function showErr(m){let el=document.getElementById('errb');if(!el){el=document.createElement('pre');el.id='errb';el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;margin:0;padding:8px 10px;background:#b00020;color:#fff;font:12px/1.3 monospace;white-space:pre-wrap;max-height:40vh;overflow:auto';el.onclick=()=>el.remove();document.body.appendChild(el)}el.textContent+=m+'\n'}
window.addEventListener('error',e=>showErr('ERR '+e.message+' (строка '+(e.lineno||'?')+')'));
window.addEventListener('unhandledrejection',e=>showErr('PROMISE '+(e.reason&&(e.reason.message||e.reason.code)||e.reason)));
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const FULL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const GROUPS=['Ягодицы','Квадрицепс','Бицепс бедра','Икры','Спина','Грудь','Плечи','Бицепс','Трицепс','Пресс'];
const PAL=['#d98a6c','#c9a227','#7fa37a','#6f9fb5','#9b8bbf','#c77f9f','#8c9a5b','#c4785a'];
const KEY='workout-v3';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const mkSets=e=>Array.isArray(e.sets)
  ?e.sets.map(t=>({r:String(t.r||''),w:String(t.w||''),d:!!t.d}))
  :Array.from({length:Math.max(1,parseInt(e.s)||3)},()=>({r:String(e.r||''),w:String(e.w||''),d:!!e.d}));
const norm=e=>{
  const sets=mkSets(e);if(!sets.length)sets.push({r:'',w:'',d:false});
  return{id:e.id||uid(),n:String(e.n||''),g:String(e.g||''),sets,day:Number.isInteger(e.day)&&e.day>=0&&e.day<7?e.day:null};
};
const ext=o=>({
  runs:Array.isArray(o.runs)?o.runs.filter(r=>r&&Array.isArray(r.pts)):[],
  steps:(o.steps&&typeof o.steps==='object'&&!Array.isArray(o.steps))?o.steps:{},
  sst:(o.sst&&typeof o.sst.c==='number')?o.sst:null,
  plan:(Array.isArray(o.plan)&&o.plan.length===7)?o.plan.map(v=>+v>0?+v:null):[null,null,null,null,null,null,null],
  cfg:{goal:+(o.cfg&&o.cfg.goal)||10000,stride:+(o.cfg&&o.cfg.stride)||75}
});
function fromAny(o){
  if(!o)return null;
  if(Array.isArray(o.items))return{items:o.items.map(norm),week:o.week||null,...ext(o)};
  if(Array.isArray(o.days)&&o.days.length===7){
    const items=[];
    o.days.forEach((l,i)=>(Array.isArray(l)?l:[]).forEach(e=>items.push(norm({...e,day:i}))));
    return{items,week:null,...ext({})};
  }
  return null;
}
let S=fromAny(load(KEY))||fromAny(load('workout-v2'))||fromAny(load('workout-v1'))||{items:[],week:null,...ext({})};
(function(){const e=ext(S);['runs','steps','plan','cfg'].forEach(k=>{if(!S[k])S[k]=e[k]})})();
const todayIdx=()=>(new Date().getDay()+6)%7;
let tab='today',filter='all',viewDay=todayIdx();
const opened=new Set();
const find=id=>S.items.find(x=>x.id===id);
const isDone=e=>e.sets.every(s=>s.d);
const gcol=g=>{const k=g.trim().toLowerCase();if(!k)return'var(--mute)';let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function weekKey(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function checkWeek(){
  const k=weekKey();let reset=false;
  if(S.week&&S.week!==k){S.items.forEach(e=>e.sets.forEach(s=>s.d=false));reset=true}
  S.week=k;save();return reset;
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
const dayName=k=>k===null?'Не распределено':FULL[k];
function summ(e){
  const a=e.sets,f=a[0];
  return a.every(s=>s.r===f.r&&s.w===f.w)?`${a.length} × ${f.r||'–'} · ${f.w||'–'} кг`:`${a.length} подх., значения разные`;
}

function card(e,plan){
  const open=!plan||opened.has(e.id),nd=e.sets.filter(s=>s.d).length,id=e.id;
  let h=`<div class="ex${isDone(e)?' done':''}" style="--gc:${gcol(e.g)}"><div class="hdr">`
    +(plan?`<button class="grip" data-grip="${id}" aria-label="Перетащить на день">≡</button>`:'')
    +`<div class="hd"${plan?` data-act="toggle" data-id="${id}"`:''}><b>${esc(e.n)||'Без названия'}</b><small>${esc(e.g.trim()||'Без группы')} · ${summ(e)}</small></div><span class="cnt">${nd}/${e.sets.length}</span></div>`;
  if(open){
    h+='<div class="body">';
    if(plan)h+=`<input class="nm" data-id="${id}" data-f="n" value="${esc(e.n)}" placeholder="Название упражнения"><input class="grp" list="groups" data-id="${id}" data-f="g" value="${esc(e.g)}" placeholder="Группа мышц">`;
    h+='<div class="set sh"><span></span><span></span><span>Повторы</span><span>Вес, кг</span></div>';
    h+=e.sets.map((s,i)=>`<div class="set"><span class="sn">${i+1}</span><button class="sc${s.d?' on':''}" data-act="sd" data-id="${id}" data-i="${i}" aria-label="Подход выполнен">✓</button><input data-id="${id}" data-i="${i}" data-f="r" inputmode="numeric" placeholder="–" value="${esc(s.r)}"><div class="wt"><button data-act="wm" data-id="${id}" data-i="${i}" aria-label="Меньше">−</button><input data-id="${id}" data-i="${i}" data-f="w" inputmode="decimal" placeholder="–" value="${esc(s.w)}"><button data-act="wp" data-id="${id}" data-i="${i}" aria-label="Больше">+</button></div></div>`).join('');
    h+=`<div class="acts"><button class="pill" data-act="sa" data-id="${id}">+ Подход</button><button class="pill" data-act="sr" data-id="${id}">− Подход</button>`
      +(plan?`<button class="pill del" data-act="del" data-id="${id}">Удалить</button>`:'')+'</div></div>';
  }
  return h+'</div>';
}

function viewToday(){
  const l=S.items.filter(e=>e.day===viewDay),isT=viewDay===todayIdx();
  const tot=l.reduce((a,e)=>a+e.sets.length,0),dn=l.reduce((a,e)=>a+e.sets.filter(s=>s.d).length,0);
  return `<div class="th"><button class="nv" data-vd="-1" aria-label="Предыдущий день">‹</button><div><h1>${isT?'Сегодня':FULL[viewDay]}</h1><div class="sub">${isT?FULL[viewDay]+' · ':''}${l.length?l.filter(isDone).length+' из '+l.length+' упражнений':(S.plan[viewDay]?'бег по плану':'отдых')}</div></div><button class="nv" data-vd="1" aria-label="Следующий день">›</button></div>`
    +todayExtra(isT)
    +(tot?`<div class="pb"><i style="width:${Math.round(dn/tot*100)}%"></i></div>`:'')
    +(l.length?l.map(e=>card(e,false)).join(''):(S.plan[viewDay]?'':'<p class="empty">На этот день ничего не запланировано.<br><br><button class="pill acc" data-tab="plan">Открыть план</button></p>'));
}
function viewPlan(){
  const chips=DAYS.map((d,i)=>{
    const l=S.items.filter(e=>e.day===i),n=l.filter(isDone).length;
    return `<button class="tab${filter===i?' on':''}" data-day="${i}" data-drop="${i}">${d}<small>${l.length?n+'/'+l.length:'·'}</small></button>`;
  }).join('');
  const order=filter==='all'?[null,0,1,2,3,4,5,6]:[filter==='none'?null:filter];
  let html='';
  order.forEach(k=>{
    const l=S.items.filter(e=>e.day===k);
    if(!l.length){if(filter!=='all')html+='<p class="empty">Здесь пока пусто.<br>Перетащи сюда упражнение за значок ≡ или добавь новое.</p>';return}
    html+=`<h2 class="gh">${dayName(k)}<small>${l.filter(isDone).length}/${l.length}</small></h2>`+l.map(e=>card(e,true)).join('');
  });
  if(!S.items.length)html='<p class="empty">Пока нет упражнений.<br>Нажми «Добавить упражнение» и составь свой недельный план.</p>';

const Cap=window.Capacitor,isNative=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
const plug=n=>{try{return Cap.registerPlugin?Cap.registerPlugin(n):(Cap.Plugins&&Cap.Plugins[n])||null}catch(e){return null}};
const BG=isNative?plug('BackgroundGeolocation'):null;
const StepsP=isNative?plug('Steps'):null;
const RKEY='workout-run-active';
const RAD=Math.PI/180,ER=6371000;
let RUN=load(RKEY),WID=null,openRun=null,stepsErr=null,lastSave=0;
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const fmtKm=m=>(m/1000).toFixed(2).replace('.',',');

const fmtPace=s=>(!s||!isFinite(s)||s>3600)?'–':Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
function hav(a,b){const dl=(b[0]-a[0])*RAD,dn=(b[1]-a[1])*RAD,x=Math.sin(dl/2)**2+Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin(dn/2)**2;return 2*ER*Math.asin(Math.min(1,Math.sqrt(x)))}
function simplify(p,tol){
  if(p.length<3)return p;
  const kx=Math.cos(p[0][0]*RAD)*ER*RAD,ky=ER*RAD,X=p.map(q=>[q[1]*kx,q[0]*ky]),keep=new Uint8Array(p.length);
  keep[0]=keep[p.length-1]=1;
  const st=[[0,p.length-1]];
  while(st.length){
    const[a,b]=st.pop(),ax=X[a][0],ay=X[a][1],dx=X[b][0]-ax,dy=X[b][1]-ay,l2=dx*dx+dy*dy;
    let md=0,mi=-1;
    for(let i=a+1;i<b;i++){
      let t=l2?((X[i][0]-ax)*dx+(X[i][1]-ay)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
      const px=ax+t*dx-X[i][0],py=ay+t*dy-X[i][1],d=Math.sqrt(px*px+py*py);
      if(d>md){md=d;mi=i}
    }
    if(md>tol&&mi>0){keep[mi]=1;st.push([a,mi],[mi,b])}
  }
  return p.filter((_,i)=>keep[i]);
}
function routeSVG(pts,w,h){
  w=w||320;h=h||200;
  if(!pts||pts.length<2)return'<div class="empty" style="padding:50px 0">Маршрут появится, когда телефон поймает GPS</div>';
  const pad=18,k=Math.cos(pts[0][0]*RAD);
  const xy=pts.map(p=>[p[1]*k,-p[0]]);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  xy.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])});
  const dx=Math.max(x1-x0,1e-5),dy=Math.max(y1-y0,1e-5),sc=Math.min((w-2*pad)/dx,(h-2*pad)/dy);
  const ox=(w-dx*sc)/2,oy=(h-dy*sc)/2,P=xy.map(q=>[ox+(q[0]-x0)*sc,oy+(q[1]-y0)*sc]);
  const d=P.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '),s=P[0],e=P[P.length-1];
  let g='';
  for(let i=1;i<4;i++)g+=`<line x1="0" y1="${h*i/4}" x2="${w}" y2="${h*i/4}"/><line x1="${w*i/4}" y1="0" x2="${w*i/4}" y2="${h}"/>`;
  return`<svg class="rm" viewBox="0 0 ${w} ${h}" role="img" aria-label="Маршрут"><g stroke="var(--line)" stroke-width="1">${g}</g><polyline points="${d}" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${s[0]}" cy="${s[1]}" r="6" fill="var(--ok)" stroke="var(--card)" stroke-width="2"/><circle cx="${e[0]}" cy="${e[1]}" r="7" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/></svg>`;
}
const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const weekRuns=()=>S.runs.filter(r=>r.start>=weekStart());
const runDayKm=i=>weekRuns().filter(r=>(new Date(r.start).getDay()+6)%7===i).reduce((a,r)=>a+r.dist,0);
const elapsed=()=>RUN?((RUN.pausedAt||Date.now())-RUN.t0-RUN.pauseMs)/1000:0;
function curSpeed(){
  const p=RUN.pts;if(p.length<2)return 0;
  const e=p[p.length-1];if(Date.now()-e[2]>30000)return 0;
  let i=p.length-2;while(i>0&&e[2]-p[i][2]<20000)i--;
  const dt=(e[2]-p[i][2])/1000;if(dt<=0)return 0;
  let d=0;for(let k=i;k<p.length-1;k++)d+=hav(p[k],p[k+1]);
  return d/dt;
}

function onLoc(l){
  if(!RUN)return;
  RUN.acc=l.accuracy;
  if(RUN.pausedAt||!(l.accuracy<=35))return;
  const t=l.time||Date.now(),p=[l.latitude,l.longitude,t],last=RUN.pts[RUN.pts.length-1];
  if(!last||RUN.brk){RUN.pts.push(p);RUN.brk=false}
  else{
    const d=hav(last,p),dt=(t-last[2])/1000;
    if(dt<=0||d<3||d/dt>12)return;
    RUN.dist+=d;RUN.pts.push(p);
  }
  if(Date.now()-lastSave>8000)saveRunNow();
}

function splits(r){
  const p=r.pts,out=[];if(p.length<2)return out;
  let len=0;for(let i=1;i<p.length;i++)len+=hav(p[i-1],p[i]);
  const f=len?r.dist/len:1;let cum=0,next=1000,tPrev=p[0][2];
  for(let i=1;i<p.length;i++){
    const d=hav(p[i-1],p[i])*f;
    while(d>0&&cum+d>=next){
      const fr=(next-cum)/d,tAt=p[i-1][2]+fr*(p[i][2]-p[i-1][2]);
      out.push((tAt-tPrev)/1000);tPrev=tAt;next+=1000;
    }
    cum+=d;
  }
  return out;
}

      return`<div class="th"><button class="nv" data-r="back" aria-label="Назад">‹</button><div><h1>${fmtKm(r.dist)} км</h1><div class="sub">${d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}, ${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div></div></div>`
        +`<div class="rmap">${routeSVG(r.pts)}</div>`
        +`<div class="mg"><div class="mt"><small>Время</small><b>${fmtDur(r.dur)}</b></div><div class="mt"><small>Средний темп, /км</small><b>${fmtPace(pace)}</b></div><div class="mt"><small>Скорость, км/ч</small><b>${r.dur?(r.dist/r.dur*3.6).toFixed(1).replace('.',','):'–'}</b></div><div class="mt"><small>Точек маршрута</small><b>${r.pts.length}</b></div></div>`
        +(sp.length?'<h2 class="gh">Километры</h2><div class="card2">'+sp.map((t,i)=>`<div class="spl"><span>${i+1} км</span><span>${fmtPace(t)} /км</span></div>`).join('')+'</div>':'')
        +`<div class="bgrid" style="margin-top:14px"><button class="btn sec" data-r="gpx">Сохранить GPX</button><button class="btn out" data-r="delrun">Удалить</button></div>`;
    }
    openRun=null;
  }
  const wr=weekRuns(),km=wr.reduce((a,r)=>a+r.dist,0),pl=S.plan[todayIdx()];
  return`<div class="th"><div><h1>Бег</h1><div class="sub">За неделю: ${fmtKm(km)} км · ${wr.length} ${wr.length===1?'пробежка':'пробежек'}</div></div></div>`
    +(pl?`<div class="rc"><div class="rrow"><div><b>Сегодня по плану</b><span class="sub">${fmtKm(pl*1000)} км · сделано ${fmtKm(runDayKm(todayIdx()))} км</span></div></div></div>`:'')
    +'<button class="btn wide" data-r="start">Начать пробежку</button>'
    +(isNative?'':'<p class="sub" style="text-align:center">В браузере GPS работает только пока вкладка открыта.</p>')
    +'<h2 class="gh">Прошлые пробежки</h2>'
    +(S.runs.length?'<div class="card2">'+S.runs.slice(0,30).map(r=>{const d=new Date(r.start),p=r.dist>0?r.dur/(r.dist/1000):0;return`<button class="rli" data-r="open" data-rid="${r.id}"><span><b>${fmtKm(r.dist)} км</b><small>${d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'})} · ${fmtDur(r.dur)}</small></span><span class="sub">${fmtPace(p)} /км ›</span></button>`}).join('')+'</div>':'<p class="empty">Пока нет пробежек.<br>Нажми «Начать пробежку», когда выйдешь на улицу.</p>');
}

/* Шагомер */
const stepsToday=()=>S.steps[dkey()]||0;
async function syncSteps(){
  if(!StepsP)return;
  let c;
  try{c=(await StepsP.getCounter()).counter;stepsErr=null}
  catch(e){stepsErr=String(e&&(e.message||e.code)||e);paintSteps(true);return}
  const k=dkey();
  if(!S.sst)S.sst={c:c};
  const delta=c>=S.sst.c?c-S.sst.c:c;
  if(delta>0)S.steps[k]=(S.steps[k]||0)+Math.round(delta);
  else if(S.steps[k]===undefined)S.steps[k]=0;
  S.sst.c=c;
  const keys=Object.keys(S.steps).sort();
  while(keys.length>400)delete S.steps[keys.shift()];
  save();paintSteps();
}
function paintSteps(force){
  const n=stepsToday(),g=S.cfg.goal||10000,pct=Math.min(100,Math.round(n/g*100));
  const a=$('#stT');if(a)a.textContent=fmtN(n)+' из '+fmtN(g);
  const b=$('#stB');if(b)b.style.width=pct+'%';
  if(tab==='steps'){
    const ae=document.activeElement;
    if((force||paintSteps.last!==n)&&!(ae&&ae.tagName==='INPUT')){paintSteps.last=n;render()}
  }
}
function viewSteps(){
  const n=stepsToday(),g=S.cfg.goal||10000,pct=Math.min(1,n/g),C=2*Math.PI*70,km=n*(S.cfg.stride||75)/100000;
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({d,v:S.steps[dkey(d)]||0})}
  const mx=Math.max(g,...days.map(x=>x.v)),avg=days.reduce((a,x)=>a+x.v,0)/7;
  let msg='';
  if(!isNative)msg='Шаги считаются только в установленном приложении на телефоне.';
  else if(stepsErr&&/no_sensor/.test(stepsErr))msg='В этом телефоне нет датчика шагов.';
  else if(stepsErr&&/permission/.test(stepsErr))msg='Нет доступа к датчику шагов. Разреши «Физическая активность» в настройках приложения.';
  else if(stepsErr)msg='Не удалось прочитать датчик шагов. Попробуй ещё раз.';
  return`<div class="th"><div><h1>Шаги</h1><div class="sub">Считает датчик телефона, интернет не нужен</div></div></div>`
    +(msg?`<div class="warn">${msg}${isNative?'<br><button class="pill acc" style="margin-top:8px" data-r="stepsretry">Проверить снова</button>':''}</div>`:'')
    +`<div class="ringw"><svg class="ring" viewBox="0 0 180 180"><circle cx="90" cy="90" r="70" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="90" cy="90" r="70" fill="none" stroke="var(--ok)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 90 90)"/><text x="90" y="92" text-anchor="middle" font-size="32" font-weight="700" fill="var(--ink)" stroke="none">${fmtN(n)}</text><text x="90" y="116" text-anchor="middle" font-size="13" fill="var(--mute)" stroke="none">из ${fmtN(g)}</text></svg></div>`
    +`<div class="mg"><div class="mt"><small>Пройдено, км</small><b>${km.toFixed(1).replace('.',',')}</b></div><div class="mt"><small>В среднем за 7 дней</small><b>${fmtN(avg)}</b></div></div>`
    +'<h2 class="gh">Последние 7 дней</h2><div class="card2" style="padding:10px 14px 12px"><div class="sbar">'
    +days.map((x,i)=>`<div><i class="${i===6?'t':x.v>=g?'g':''}" style="height:${Math.max(2,Math.round(x.v/mx*84))}px"></i><span>${DAYS[(x.d.getDay()+6)%7]}</span></div>`).join('')+'</div></div>'
    +'<h2 class="gh">Настройки</h2><div class="card2" style="padding:12px 14px"><div class="cfg"><label>Цель, шагов в день<input data-cfg="goal" inputmode="numeric" value="'+g+'"></label><label>Длина шага, см<input data-cfg="stride" inputmode="numeric" value="'+(S.cfg.stride||75)+'"></label></div></div>';
}
function todayExtra(isT){
  let h='';
  if(isT&&StepsP){
    const n=stepsToday(),g=S.cfg.goal||10000;
    h+=`<div class="rc" data-tab="steps" style="cursor:pointer"><div class="rrow"><b>Шаги</b><span class="sub" id="stT">${fmtN(n)} из ${fmtN(g)}</span></div><div class="pb"><i id="stB" style="width:${Math.min(100,Math.round(n/g*100))}%"></i></div></div>`;
  }
  const pl=S.plan[viewDay],dn=runDayKm(viewDay);
  if(isT||pl){
    h+=`<div class="rc"><div class="rrow"><div><b>Бег${pl?' · цель '+fmtKm(pl*1000)+' км':''}${pl&&dn>=pl*1000?' ✓':''}</b><span class="sub">${dn>0?'сделано '+fmtKm(dn)+' км':'пока без пробежек'}</span></div>`
      +(isT?`<button class="btn" data-r="start">${RUN?'К пробежке':'Начать'}</button>`:'')+'</div>'
      +(pl?`<div class="pb"><i style="width:${Math.min(100,Math.round(dn/(pl*1000)*100))}%"></i></div>`:'')+'</div>';
  }
  return h;
}
function runPlanCard(){
  return'<h2 class="gh">Пробежки по неделе<small>км на день</small></h2><div class="card2"><div class="rp">'
    +DAYS.map((d,i)=>`<label>${d}<input data-rp="${i}" inputmode="decimal" placeholder="–" value="${S.plan[i]||''}"></label>`).join('')+'</div></div>';
}
function restoreFrom(txt){
  try{
    const d=fromAny(JSON.parse(txt));
    if(!d)throw 0;
    if(!confirm('Заменить текущие данные восстановленными?'))return;
    S=d;save();checkWeek();render();$('#dlg').close();toast('Данные восстановлены');
  }catch(e){alert('Не получилось прочитать данные. Проверь, что файл или текст целые.')}
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-r]');if(!b)return;
  const a=b.dataset.r;
  if(a==='start'){if(RUN){tab='run';openRun=null;render()}else await startRun()}
  else if(a==='pause')pauseRun();
  else if(a==='stop')stopRun();
  else if(a==='open'){openRun=b.dataset.rid;render();window.scrollTo(0,0)}
  else if(a==='back'){openRun=null;render()}
  else if(a==='gpx'){const r=S.runs.find(x=>x.id===openRun);if(r)saveFile('probezhka-'+dkey(new Date(r.start))+'.gpx',toGPX(r),'application/gpx+xml')}
  else if(a==='delrun'){if(confirm('Удалить эту пробежку?')){S.runs=S.runs.filter(x=>x.id!==openRun);openRun=null;save();render()}}
  else if(a==='stepsretry')syncSteps();
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.rp!==undefined){const v=parseFloat(String(t.value).replace(',','.'));S.plan[+t.dataset.rp]=v>0?v:null;save();return}
  if(t.dataset.cfg){const v=parseFloat(String(t.value).replace(',','.'));if(v>0){S.cfg[t.dataset.cfg]=v;save();if(t.dataset.cfg==='goal')paintSteps()}}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){saveRunNow()}
  else{syncSteps();if(tab==='run')render()}
});
$('#sv').onclick=()=>saveFile('treni-backup-'+dkey()+'.json',JSON.stringify(S),'application/json');
$('#ld').onclick=()=>$('#bf').click();
$('#bf').onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value='';
  if(f)restoreFrom(await f.text());
};
function initRunSteps(){
  if(RUN&&!RUN.pausedAt)RUN.pausedAt=RUN.seen||Date.now();
  setInterval(()=>{if(RUN&&tab==='run')paintRun()},1000);
  if(StepsP){syncSteps();setInterval(()=>{if(!document.hidden)syncSteps()},15000)}
}

const newWeek=checkWeek();
render();
if(newWeek)toast('Новая неделя: отметки сняты');
initRunSteps();
</script>
</body>
</html>
